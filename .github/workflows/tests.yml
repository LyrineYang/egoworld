name: Pipeline checks
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-and-ray:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]' 'ray>=2.8,<3'
      - run: pytest -q -m 'not env_smoke and not pipeline_smoke and not sam2_smoke and not native_models'
        env:
          EGOWORLD_RAY_TEST: '1'
          RAY_USAGE_STATS_ENABLED: '0'
