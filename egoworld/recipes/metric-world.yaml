version: 1
config: ../configs/full.json
inputs: [../../data/samples/mustard/mustard-3frames.mp4]
outputs: [world_camera, world_scene, world_object]
output_dir: /mnt/d/EgoWorld/runs/data
cache:
  root: /mnt/d/EgoWorld/cache/stages
operators:
  sam2:
    prompting:
      prompt_text: 'bottle .'
  fast3r:
    image_size: 512
    max_views: 3
calibration:
  method: rgbd
  assets_manifest: ../../config.local/mustard-rgbd-assets.json
  threshold_m: 0.03
  min_inlier_fraction: 0.5
  confidence_quantile: 0.5
