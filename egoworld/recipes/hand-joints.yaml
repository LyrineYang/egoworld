version: 1
config: ../configs/rgb.json
inputs: [../../data/samples/epic-dough-3s.mp4]
outputs:
  - boxes
  - type: hand_joints
    fields: [joints_3d, camera_translation]
output_dir: /mnt/d/EgoWorld/runs/data
cache:
  root: /mnt/d/EgoWorld/cache/stages
operators:
  sam2:
    prompting:
      prompt_text: 'hand .'
      box_threshold: 0.22
      text_threshold: 0.22
      max_boxes_per_frame: 4
  hamer:
    object_ids: [1, 2]
    handedness_by_id: {'1': right, '2': left}
