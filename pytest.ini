[pytest]
addopts = -ra
testpaths = egoworld/tests
pythonpath = egoworld/src
markers =
    env_smoke: environment smoke checks (GPU/driver/ffmpeg/path)
    pipeline_smoke: minimal end-to-end pipeline smoke tests
    sam2_smoke: SAM2 integration smoke test
    ray_integration: real Ray processes with test model fixtures, no CUDA inference
    native_models: real model weights/environments and a user-provided video
